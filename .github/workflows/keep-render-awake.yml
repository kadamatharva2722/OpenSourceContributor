
name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake Render Backend
        run: |
          echo "Pinging Render backend..."

          curl \
            --fail \
            --location \
            --show-error \
            --output /dev/null \
            --write-out "HTTP Status: %{http_code}\nResponse Time: %{time_total}s\n" \
            --connect-timeout 30 \
            --max-time 240 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 15 \
            "https://opensourcecontributor-backend.onrender.com/api/v1/system/wake"

          echo "Backend wake request completed."
