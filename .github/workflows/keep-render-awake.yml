name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render Backend
        run: |
          echo "Sending wake request to Render..."

          curl --fail \
            --location \
            --silent \
            --show-error \
            --output /dev/null \
            --connect-timeout 20 \
            --max-time 90 \
            "https://opensourcecontributor-backend.onrender.com/api/v1/system/wake"

          echo "Render backend responded successfully."