
name: Keep Render Backend Awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render backend
        run: |
          curl --location \
            --silent \
            --show-error \
            --output /dev/null \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            "https://opensourcecontributor-backend.onrender.com/api/v1/auth/csrf"
