# Test Configuration
# Exclude database auto-configuration for unit/smoke tests when no live PostgreSQL instance is running
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.info.enabled=true
management.info.env.enabled=false

# OpenAPI / Swagger Documentation Configuration
app.openapi.enabled=${APP_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:${app.openapi.enabled:true}}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:${app.openapi.enabled:true}}

# AI Search Quota Configuration
app.ai.daily-limit.registered=20
app.ai.quota-timezone=UTC

# GitHub OAuth 2.0 Test Configuration (Unconfigured credentials by default)
app.oauth2.github.client-id=
app.oauth2.github.client-secret=
app.oauth2.github.scope=read:user
app.oauth2.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.frontend.url=http://localhost:5173

# Spring AI / Groq Test Configuration (AI disabled by default in tests without network dependencies)
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=disabled
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
app.groq.enabled=false
