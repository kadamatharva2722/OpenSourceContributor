# ==============================================================================
# OpenSourceContributor Backend - Application Configuration
# ==============================================================================

# Server Configuration
server.port=8080
server.forward-headers-strategy=framework

# Application Name
spring.application.name=backend

# Datasource Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/osc_db}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.info.enabled=true
management.info.env.enabled=false

# OpenAPI / Swagger Documentation Configuration
app.openapi.enabled=${APP_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:${app.openapi.enabled:true}}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:${app.openapi.enabled:true}}

# AI Search Quota Configuration
app.ai.daily-limit.registered=20
app.ai.quota-timezone=UTC

# GitHub OAuth 2.0 Configuration
# Credentials are read from environment variables (GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET)
# When unset in development/testing, OAuth remains safely disabled via EmptyClientRegistrationRepository
app.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.oauth2.github.scope=${GITHUB_OAUTH_SCOPE:read:user}
app.oauth2.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# GitHub REST API Integration Configuration (Public API Discovery)
app.github.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
app.github.connect-timeout=${GITHUB_API_CONNECT_TIMEOUT:5000}
app.github.read-timeout=${GITHUB_API_READ_TIMEOUT:10000}
app.github.max-retries=${GITHUB_API_MAX_RETRIES:3}
app.github.retry-backoff-ms=${GITHUB_API_RETRY_BACKOFF_MS:1000}
app.github.user-agent=${GITHUB_API_USER_AGENT:OpenSourceContributor-App}

# HTTP Session Cookie Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ==============================================================================
# Spring AI / Groq Configuration (OpenAI-Compatible API)
# ==============================================================================

spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:disabled}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.temperature=${GROQ_TEMPERATURE:0.2}

app.groq.enabled=${GROQ_ENABLED:true}

# ==============================================================================
# Client IP Rate Limiting & Proxy Configuration
# ==============================================================================
app.security.rate-limit.guest-requests-per-hour=60
app.security.rate-limit.guest-window-seconds=3600
app.security.rate-limit.max-tracked-ips=10000

# Trusted reverse proxies for client IP extraction from X-Forwarded-For (comma-separated IPs/CIDRs)
# Security Notice: Leave EMPTY by default (Direct connection mode, trusts 0 proxies and uses socket remoteAddr).
# WARNING: Do NOT blindly set 10.0.0.0/8 on shared cloud environments (e.g. Render). Only specify exact IP addresses
# or verified isolated subnet CIDRs of upstream reverse proxies / load balancers known to the platform operator.
app.security.rate-limit.trusted-proxies=${APP_TRUSTED_PROXIES:}

# OAuth 2.0 Rate Limiting (Independent Initiation and Callback limits)
app.security.rate-limit.oauth-initiation-max-attempts=15
app.security.rate-limit.oauth-initiation-window-seconds=900
app.security.rate-limit.oauth-callback-max-attempts=30
app.security.rate-limit.oauth-callback-window-seconds=900
app.security.rate-limit.oauth-max-tracked-ips=5000
